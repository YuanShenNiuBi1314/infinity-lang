# appendix E.3 - INFY v2.0 B-track capability table (IFBC-CAP-<lang>-<minor>.toml).
# Normative data for the capability scan of 7.7.2; it REPLACED the old hand-written subset list.
#
# GENERATED by scripts/gen-cap-table-py313.py --apply. Do not edit by hand: the name set and
# every 0xNN value are CPython 3.13's own, read from
#   https://raw.githubusercontent.com/python/cpython/3.13/Include/opcode_ids.h (sha256 e30e7b48f764be2b)
#   https://raw.githubusercontent.com/python/cpython/3.13/Python/bytecodes.c (sha256 fd819b75d19b96af)
# and cross-checked against tag v3.13.0, whose derivation is byte-identical to the 3.13 branch.
# opcode_ids.h also lists the specialization opcodes, which dis.opmap does not; the rows here
# are header names MINUS every 'family(...) = { ... }' member -- and a name commented out
# inside such a block still counts as a member, which is how BINARY_OP_INPLACE_ADD_UNICODE
# (0x03) stays out; that reading reproduces dis.opmap exactly on the calibration version.
# The rule was not assumed: the
# generator re-derives dis.opmap from tag v3.14.6 and refuses to write anything unless it equals the
# dis.opmap of the interpreter actually installed on this host (154 opcodes). A 3.13 build
# host can re-run the same script; a 3.13 interpreter is NOT required to fill the numbers in,
# because the numbers come from 3.13's own released header -- inventing them from a neighbour
# version is exactly the defect this table used to be (BACKLOG F58/F28).
#
# [opcode] rows appear under BOTH forms of the same key: the numeric form E.3 mandates
# (0xNN, the value CPython's dis.opmap reports for that minor) and the OPNAME alias.
# The scanner looks up the number first and the name second, and refuses a table whose two
# rows disagree (CapTable::check_alias_agreement) - 7.7.2 wants a table an auditor can trust.
# Every name here is additionally checked against CapTable::opcode_contract("py", "3.13")
# at load time, and a table that does not match its declared minor is E-0713, not E-0712.
#
# Rows the 3.14 table could not supply (each is a declared gap, never a silent mapping):
#   BEFORE_ASYNC_WITH            = "-"       async is on appendix F.1's closed do-not-do list
#   BEFORE_WITH                  = "-"       no IFBC counterpart for the with-entry protocol; SETUP_WITH is '-' in the generated 3.14 table too
#   BINARY_SUBSCR                = "idx.get" 3.13 keeps x[i] as its own opcode; 3.14 folded [] into BINARY_OP, whose '[]->idx.get' arm is the same target
#   BUILD_CONST_KEY_MAP          = "-"       needs a 'key tuple + N values' fused dict build; IFBC only has new.dict plus per-entry map.insert, so the row cannot name one instruction
#   INSTRUMENTED_RETURN_CONST    = "-"       instrumented forms appear only under tracing/profiling; every other INSTRUMENTED_* row is '-'
#   LOAD_ASSERTION_ERROR         = "-"       assert's raise path is RAISE_VARARGS, which is '-' in both tables; mapping the push alone would claim a half-built construct
#   LOAD_METHOD                  = "-"       bound-method dispatch needs the Python object model; the 3.14 table rejects LOAD_ATTR's 'method' arm for the same reason
#   LOAD_SUPER_METHOD            = "-"       same object-model gap as LOAD_METHOD, plus super() lookup
#   LOAD_ZERO_SUPER_ATTR         = "-"       pseudo-op used only by super() lowering; not mapped
#   LOAD_ZERO_SUPER_METHOD       = "-"       pseudo-op used only by super() lowering; not mapped
#   RETURN_CONST                 = "-"       no fused push+ret mnemonic in appendix D; candidates in 'a|b' are alternatives, not sequences, so emitting 'push' alone would drop the return (fake success)
#   BINARY_OP arm '[]' is dropped: in 3.13 a subscript is BINARY_SUBSCR, so the case is
#     unreachable and keeping it would claim an arm the argument domain can never produce.
#
# Value grammar (mirrored in docs/internals/ifbc-encoding-rust.md):
#   "-"          unmapped on purpose  -> E-0712 naming this exact item
#   "ignore"     no IFBC counterpart; the instruction is dropped
#   "<mnemonic>" one-to-one mapping onto an appendix-D instruction
#   "<op>._"     the `_` is the type suffix the lowering inferred (add._ -> add.i64/add.f64)
#   "arg:k->v,..."  dispatch on the instruction argument; "else->v" is the default branch
#   "a|b"        candidate list, first applicable one wins (e.g. add._|host:std.str.concat)
#   "host:<path>" emits call.host and creates the import_table row (7.8.3 check item 5)

[cap]
lang = "cpython"
format = "CPY-313"
cap_version = 1
table_hash = "sha256:6fe81262fd828d6cef267fd44772e08b84f58d62d5e3c09678de2dc734739985"   # sha256 over every line that does not start with table_hash

