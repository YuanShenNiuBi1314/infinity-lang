[import]   # scan item 3: the module-name constant of the import instruction
allow = ["math", "json", "itertools"]
deny = ["numpy", "opencv", "pillow"]   # native extensions -> E-0712 plus the three ways out of 7.7.4

[exception]   # scan item 5: co_exceptiontable entry classes
entry = ["push", "setup", "with"]
# Note: handler-class entries are additionally gated by [opcode] -
# PUSH_EXC_INFO / CHECK_EXC_MATCH / RERAISE are "-" in this table, so a Python
# try/except still fails the build; this section only declares which entry SHAPES map.
